<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header class="cabecalho">
        <a href="#" class="logo">
            <!-- IMAGEM -->
            <span>MusicHub.</span>
        </a>
    </header>

    <main class="conteudo">

        <section class="login">
            <div class="login-cabecalho">
                <h1>Bem-vindo</h1>
            </div>

            <form>
                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                </div>

                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha">
                </div>

                <p class="divisor">ou</p>

                <button type="button" class="botao-social botao-google">
                    <!-- IMAGEM -->
                    <span>Continuar com Google</span>
                </button>

                <button type="button" class="botao-social botao-facebook">
                    <!-- IMAGEM -->
                    <span>Continuar com Facebook</span>
                </button>

                <button type="button" class="botao-social botao-apple">
                    <!-- IMAGEM -->
                    <span>Continuar com Apple</span>
                </button>

                <p class="texto-cadastro">
                    Ainda não tem uma conta?
                </p>

                <a href="#" class="link-cadastrar">Cadastrar</a>

                <button type="submit" class="botao-entrar">Entrar</button>
            </form>
        </section>

    </main>

    <script src="login.js"></script>
</body>

</html>
