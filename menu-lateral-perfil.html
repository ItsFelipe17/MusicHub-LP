<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <title>Menu Lateral</title>
</head>
<body>
    <section class="menu-lateral-perfil">

        <section class="logo">
            <button class="logo-musichub">
                <img src="imgs(menu-lateral)/Logo Music Hub.svg" alt="Logo Music Hub">
            </button>
        </section>

        <section class="conteudo-menu">
            <div class="perfil">
                <img src="imgs(menu-lateral)/foto perfil pw.svg" alt="">
                <div class="textos-perfil">
                    <h3>Leandro</h3>
                    <p>Ver perfil</p>
                </div>
            </div>

            <div class="principal">
                <h4>Principal</h4>
                <nav class="inicio">
                    <a class="icone-texto" href="Home-Perfil/home-perfil.html">
                        <img class="icone" src="imgs(menu-lateral)/casinha.svg" alt="">
                        <p>Início</p>
                    </a>
                </nav>

                <nav class="exlorar">
                    <a class="icone-texto" href="">
                        <img class="icone" src="imgs(menu-lateral)/icone explorar.svg" alt="">
                        <p>Explorar</p>
                    </a>
                </nav>
            </div>

            <span></span>

            <div class="biblioteca">
                <h4>Biblioteca</h4>
                <nav class="favoritos">
                    <a class="icone-texto" href="">
                        <img class="icone" src="imgs(menu-lateral)/coracao.svg" alt="">
                        <p>Favoritos</p>
                    </a>
                </nav>

                <nav class="adicionar">
                    <a class="icone-texto" href="">
                        <img class="icone" src="imgs(menu-lateral)/adicionar.svg" alt="">
                        <p>Adicionar música</p>
                    </a>
                </nav>

                <nav class="historico">
                    <a class="icone-texto" href="">
                        <img class="icone" src="imgs(menu-lateral)/relogio.svg" alt="">
                        <p>Histórico</p>
                    </a>
                </nav>
            </div>

            <span></span>
            
            <div class="suporte">
                <h4>Suporte</h4>
                <nav class="ajuda">
                    <a class="icone-texto" href="">
                        <img class="icone" src="imgs(menu-lateral)/interrogacao.svg" alt="">
                        <p>Ajuda</p>
                    </a>
                </nav>

                <nav class="feedback">
                    <a class="icone-texto" href="">
                        <img class="icone" src="imgs(menu-lateral)/caixinha.svg" alt="">
                        <p>Feedback</p>
                    </a>
                </nav>
                
            </div>


        </section>
    </section>

    <script src="global.js"></script>
</body>
</html>
