<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="edit-user.css">
    <link rel="shortcut icon" href="imgs/logo-musicHub.svg" type="image/svg+xml">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <title>Edição de usuário | MusicHub</title>
</head>

<body>
    <!-- CABEÇALHO -->

    <header class="cabecalho">
        <button class="botao-logo">
            <a href="../Home-Perfil/home-perfil.html">
            <img src="../tela-artista/imgs/Group 239253.svg" alt="">
            </a>
        </button>
    
        <div class="pesquisar">
            <p>Pesquisar</p>
        
            <div class="lupa">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <div class="perfil">
            <h2>Seu Perfil</h2>
        <a href="../tela-edit-user/edit-user.HTML">
        <img src="../tela-artista/imgs/pw.png" alt="">
        </a>
        </div>
    </header>

    <!-- CARTÃO DO PERFIL -->
    <main>
        <section class="perfil1" id="perfil" aria-labelledby="nome-usuario">
            <div class="topo-perfil">
                <div class="dados-usuario">
                    <img class="foto-usuario" src="imgs/leandro.svg" alt="Foto de Leandro">

                    <div class="identificacao">
                        <h1 id="nome-usuario">Leandro</h1>
                        <p>Leandrodelavale@gmail.com</p>
                    </div>
                </div>
                <div class="botoes">
                    <button class="botao-salvar" type="button">Salvar</button>
                    <a href="../Tela Cadastro/cadastro.html" class="botao-sair">Sair</a>
                </div>
            </div>

            <!-- CAMPOS DE EDIÇÃO -->
            <form class="formulario-perfil">
                <div class="campo">
                    <label for="nome-completo">Nome completo</label>
                    <input type="text" id="nome-completo" name="nome" placeholder="Seu Nome">
                </div>

                <div class="campo">
                    <label for="apelido">Apelido</label>
                    <input type="text" id="apelido" name="apelido" placeholder="como vamos te chamar?">
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <div class="campo-com-seta">
                        <select id="genero" name="genero">
                            <option value="">Prefiro não informar</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                            <option value="outro">Outro</option>
                        </select>
                        <span class="seta" aria-hidden="true">v</span>
                    </div>
                </div>

                <div class="campo">
                    <label for="telefone">Número de Telefone</label>
                    <div>
                        <input type="tel" id="telefone" name="telefone" placeholder="11998877654">
                    </div>
                </div>
            </form>

            <!-- ENDEREÇO DE E-MAIL -->
            <section class="area-email" aria-labelledby="titulo-email">
                <h2 id="titulo-email">Meu endereço de email</h2>

                <div class="email-cadastrado">
                    <div class="icone-email">
                        <img src="imgs/mail-icon.svg" alt="">
                    </div>

                    <div class="dados-email">
                        <div class="endereco-email">
                            <p>Leandrodelaval@gmail.com</p>
                            <button class="botao-remover" type="button" aria-label="Remover endereço de email">
                                <span>×</span>
                            </button>
                        </div>
                        <p class="tempo-email">há 1 mês</p>
                    </div>
                </div>

                <button class="botao-adicionar" type="button">+Adicionar endereço de email</button>
            </section>
        </section>
    </main>
</body>

</html>
