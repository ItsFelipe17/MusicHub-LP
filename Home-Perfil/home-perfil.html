<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-Perfil</title>
   
    <link rel="stylesheet" href="home-perfil.css">
    <link rel="stylesheet" href="../global.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>
<body>
    <header class="cabecalho">
        <button class="botao-menu" id="menu">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <main>
       <section class="banner-inicio">
            <div class="itens-esquerda">
                <h1 class="bem-vindo">Bem-Vindo(a) ao MusicHub</h1>
                <div class="card-ouvindo">
                    <p>Continuar ouvindo sua playlist</p>
                    <div class="play-musica">
                        <img src="../imgs/WIN_20260818_09_18_16_Pro 1.svg" alt="">
                        <div class="botao-play">
                            <button id="icone-play">
                                <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            
            
            <div class="card-michael">
                <p>Ouvindo agora</p>
                <img id="foto-michael" src="../imgs/ab67616d0000b2733138f891f3075c9c5d944037 1.svg" alt="">
                <img src="../imgs/Group 239249 (1).svg" alt="">
            </div>
            
            
            
       </section>
       
    </main>
    
</body>
</html>
